; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Standalone Scrabble word judge. No BLE: the 2.06 MB dictionary needs the room.
[env:T-Keyboard-scrabble]
platform = espressif32 @ 6.1
board = ttgo-t-oi-plus
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
; Default Arduino table leaves the app ~1.31 MB, which the dictionary overflows.
board_build.partitions = partitions_scrabble.csv
; modifier_icons.c++ pulls in caps_active, which lives in main.cpp.
build_src_filter = +<*> -<main.cpp> -<modifier_icons.c++>
; The trie headers stay where the generator writes them.
build_flags = -I tools
lib_ignore = ESP32-BLE-Keyboard-0.3.0
lib_deps =
    https://github.com/Xinyuan-LilyGO/T-0.99TFT.git

